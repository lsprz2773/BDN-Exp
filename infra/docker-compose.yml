# Motores bajo prueba, parametrizados por perfil de recursos (playbook §2 y §3).
# Uso (desde la raíz del proyecto, dentro de WSL):
#   docker compose -f infra/docker-compose.yml -p suite_b --env-file infra/profiles/profile_b.env up -d mongodb
# Cada perfil es un proyecto de compose distinto (suite_a / suite_b / suite_c), con sus propios
# puertos, contenedores y volúmenes, así que dos suites pueden convivir en paralelo (D-03).
# Solo se levanta el motor que se está midiendo (D-21).

x-limits: &limits
  cpus: "${CPUS:?falta CPUS}"
  mem_limit: "${MEM_LIMIT:?falta MEM_LIMIT}"
  # cgroup v2 ignora mem_swappiness; se deja porque lo pide la spec y el swap
  # se desactiva igualando memswap_limit a mem_limit (D-20).
  mem_swappiness: 0
  memswap_limit: "${MEM_LIMIT:?falta MEM_LIMIT}"

services:
  mongodb:
    <<: *limits
    image: mongo:9.0.4
    command: ["mongod", "--bind_ip_all"]
    ports:
      - "127.0.0.1:${MONGO_PORT:?falta MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    labels:
      bench.profile: "${PROFILE_ID:?falta PROFILE_ID}"
      bench.engine: "mongodb"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    <<: *limits
    image: postgres:18.6
    environment:
      POSTGRES_DB: control_academico
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: "${PG_PASSWORD:?falta PG_PASSWORD}"
    ports:
      - "127.0.0.1:${PG_PORT:?falta PG_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    labels:
      bench.profile: "${PROFILE_ID:?falta PROFILE_ID}"
      bench.engine: "postgresql"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bench", "-d", "control_academico"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mongo_data:
  pg_data:
