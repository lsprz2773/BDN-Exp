# Stack de telemetría compartido por todas las suites (playbook §7).
# Uso: docker compose -f infra/monitoring/docker-compose.monitoring.yml -p monitor up -d
# Límites propios para que el monitoreo no compita con los motores por la RAM de WSL2 (D-12).

services:
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.53.0
    # Docker 29 usa el image store de containerd y la fábrica "docker" de cAdvisor falla
    # ("failed to identify the read-write layer ID", E-004). Se desactiva apuntándola a un
    # socket inexistente, y los contenedores se leen como cgroups crudos /docker/<id>.
    # El runner traduce el id al perfil y al motor con docker inspect.
    command:
      - --housekeeping_interval=1s
      - --docker=unix:///nonexistent.sock
      - --docker_only=false
      - --raw_cgroup_prefix_whitelist=/docker/
    # Con el cgroup namespace privado (por defecto en algunas versiones de Docker Desktop)
    # cAdvisor solo ve su propia cgroup y publica id="/" (E-010). Con el del host ve /docker/<id>.
    cgroup: host
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "127.0.0.1:8080:8080"
    cpus: "0.5"
    mem_limit: 256m

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      # Sin rslave: Docker Desktop no monta / como shared (E-003)
      - /:/host:ro
    ports:
      - "127.0.0.1:9100:9100"
    cpus: "0.25"
    mem_limit: 128m

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    cpus: "0.5"
    mem_limit: 512m
    depends_on:
      - cadvisor
      - node-exporter

volumes:
  prom_data:
